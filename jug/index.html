<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a0d08">
<meta name="robots" content="noindex">
<title>海賊ジョッキすべらせ｜Tooosu ハロウィン限定</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  /* スマホ縦持ち：カウンターが手前から奥へのびる1画面。夜のバーの一つの見た目に固定 */
  :root{
    --gold:#ffd23f; --orange:#ff8a1c; --red:#e6392b; --cream:#fff6e6; --ink:#1a0d08;
    color-scheme: dark;
  }
  html,body{margin:0;height:100%;background:#1a0d08;overflow:hidden;touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:"Dela Gothic One","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--cream)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;box-sizing:border-box;gap:14px;
    padding-block:max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px));
    padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .screen.on{display:flex}
  .shade{background:rgba(26,13,8,.62)}
  .kicker{font-size:clamp(15px,4vw,24px);color:var(--orange);letter-spacing:.08em}
  .logo{font-size:clamp(40px,12vw,90px);line-height:1.05;color:var(--gold);
    text-shadow:0 5px 0 #7a3a00,0 0 30px rgba(255,138,28,.5);transform:rotate(-3deg)}
  .logo small{display:block;font-size:.45em;color:var(--cream);text-shadow:0 4px 0 #5a2a10}
  .lead{font-size:clamp(16px,4.4vw,28px);line-height:1.55}
  .btn{margin-top:8px;font:inherit;font-size:clamp(26px,7vw,46px);color:#2a1000;background:var(--orange);
    border:none;border-radius:999px;padding:.45em 1.4em;box-shadow:0 8px 0 #9c4200;cursor:pointer;
    animation:pulse 1.1s ease-in-out infinite}
  .btn:active{transform:translateY(6px);box-shadow:0 2px 0 #9c4200}
  .btn:focus-visible,.pickBtn:focus-visible{outline:3px solid var(--cream);outline-offset:4px}
  @keyframes pulse{50%{transform:scale(1.06)}}
  @media (prefers-reduced-motion: reduce){ .btn{animation:none} }
  .badge{font-size:clamp(14px,3.6vw,22px);background:var(--red);padding:.35em 1em;border-radius:6px;transform:rotate(2deg)}
  #result{justify-content:space-between;background:none;pointer-events:none}
  #result > *{pointer-events:auto}
  .coupon{background:var(--cream);color:#2a1000;border-radius:14px;padding:12px 22px;border:4px dashed var(--red);
    transform:rotate(-1.5deg);max-width:min(560px, 100%);box-sizing:border-box}
  .coupon h3{margin:0 0 2px;font-size:clamp(15px,4vw,26px);color:var(--red);font-weight:normal}
  .coupon .body{font-size:clamp(26px,8vw,46px);line-height:1.2}
  .coupon .meta{font-family:"Hiragino Sans",sans-serif;font-weight:700;font-size:clamp(12px,3.2vw,17px);margin-top:6px;color:#5a3a20}
  .coupon .again{font-family:"Hiragino Sans",sans-serif;font-weight:700;font-size:clamp(12px,3.2vw,16px);color:var(--red);margin-top:4px}
  .show{font-size:clamp(15px,4vw,22px);color:var(--gold);text-shadow:0 2px 0 #000;margin-top:8px}
  .bottom{display:flex;flex-direction:column;align-items:center;gap:6px}
  #lose{justify-content:space-between;background:none;pointer-events:none}
  #lose > *{pointer-events:auto}
  .emptybox{background:rgba(26,13,8,.86);border:3px solid #8a7a6a;border-radius:14px;padding:12px 22px;max-width:min(560px,100%);box-sizing:border-box}
  .emptybox h3{margin:0;font-weight:normal;font-size:clamp(26px,8vw,44px);color:#d8cfc4}
  .emptybox .msg{white-space:pre-line;font-family:"Hiragino Sans",sans-serif;font-weight:700;font-size:clamp(13px,3.6vw,18px);margin-top:4px;color:var(--gold)}
  .best{font-family:"Hiragino Sans",sans-serif;font-weight:700;font-size:clamp(13px,3.6vw,18px);color:var(--gold)}
  .link{font:inherit;font-size:clamp(14px,3.8vw,20px);background:none;border:0;color:var(--cream);text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:6px 10px}
  .link:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
  .newt{font-family:"Hiragino Sans",sans-serif;font-weight:700;font-size:clamp(13px,3.6vw,18px);color:var(--gold);text-shadow:0 2px 0 #000;margin-top:6px;line-height:1.5}
  .newt:empty{display:none}
  #titles{justify-content:flex-start;background:rgba(26,13,8,.94);overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
  #titles .btn{flex:none;margin-top:0}
  .tl{flex:none}
  .tl-head{font-size:clamp(24px,7vw,38px);color:var(--gold)}
  .tl-head span{font-size:.6em;color:var(--cream)}
  .tl-best{font-family:"Hiragino Sans",sans-serif;font-weight:700;font-size:clamp(13px,3.6vw,17px);color:#e4d6c4}
  .tl{list-style:none;margin:0;padding:0;width:min(520px,100%);display:grid;gap:8px}
  .tl li{display:flex;align-items:center;gap:12px;text-align:left;background:#2e1a0e;border:2px solid #5a3a20;border-radius:12px;padding:8px 12px}
  .tl li.on{border-color:var(--gold);background:#3e2410}
  .tl .ic{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#5a3a20;color:#a08a74;font-size:18px}
  .tl li.on .ic{background:var(--gold);color:#2a1000}
  .tl b{display:block;font-weight:normal;font-size:clamp(15px,4.2vw,20px)}
  .tl small{display:block;font-family:"Hiragino Sans",sans-serif;font-weight:700;font-size:clamp(11px,3.2vw,14px);color:#c4a98f}
  .coupon{position:relative}
  .stamp{position:absolute;right:-8px;top:-18px;transform:rotate(12deg);border:4px solid var(--red);color:var(--red);
    border-radius:10px;padding:2px 10px;font-size:clamp(18px,5vw,28px);line-height:1.15;background:#fff6e6;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .stamp small{display:block;font-family:"Hiragino Sans",sans-serif;font-weight:700;font-size:.42em}
  .btn.use{animation:none;background:var(--gold);box-shadow:0 8px 0 #9c7a00;font-size:clamp(20px,5.5vw,30px)}
  .btn.use:active{box-shadow:0 2px 0 #9c7a00}
  .confirm{margin-top:10px;background:var(--cream);color:#2a1000;border-radius:14px;padding:12px 16px;border:3px solid var(--gold);max-width:min(560px,100%);box-sizing:border-box}
  .confirm p{margin:0 0 8px;font-family:"Hiragino Sans",sans-serif;font-weight:700;font-size:clamp(13px,3.6vw,17px);line-height:1.5}
  .confirm .row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .confirm .btn{margin-top:0}
  .confirm .link{color:#5a3a20}
  #rotate{display:none;position:fixed;inset:0;z-index:20;background:#1a0d08;color:var(--gold);font-size:clamp(20px,5vw,32px);align-items:center;justify-content:center;text-align:center}
  @media (orientation: landscape) and (max-height: 500px){ #rotate{display:flex} }
  .btn.sub{animation:none;background:#7a4a2a;color:var(--cream);box-shadow:0 8px 0 #3a1a08;font-size:clamp(20px,5.5vw,32px)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rotate">スマホを縦にしてね</div>

<div class="screen shade on" id="title">
  <div class="kicker">Tooosu ハロウィン限定</div>
  <div class="logo"><small>カウンターの奥で止めろ</small>ジョッキ<br>すべらせ</div>
  <div class="lead">ジョッキを指で上にシュッとはじいて、<br>金のラインにぴったり止めろ!!<br>ぴったり連続でコンボ!! 3連続で伝説の宝箱</div>
  <button class="btn" id="startBtn">スタート</button>
  <div class="badge">うまいほど いい宝箱が出やすい!!</div>
  <div class="best" id="bestLine"></div>
  <button class="link" id="titlesBtn">称号コレクションを見る</button>
</div>

<div class="screen" id="result">
  <div>
    <div class="coupon">
      <h3>Tooosu ハロウィン特典</h3>
      <div class="body" id="cpBody"></div>
      <div class="meta" id="cpMeta"></div>
      <div class="again" id="cpAgain" hidden></div>
      <div class="stamp" id="cpStamp" hidden></div>
    </div>
    <div class="show" id="cpShow">ハイスコアで引き直しOK。使うときは店員さんに見せてね</div>
    <div class="confirm" id="useConfirm" hidden>
      <p>店員さんが押してください。<br>使用済みにすると、今日はもう引き直せません</p>
      <div class="row"><button class="btn use" id="useYes">使用済みにする</button><button class="link" id="useNo">やめる</button></div>
    </div>
    <div class="newt" id="newWin"></div>
  </div>
  <div class="bottom">
    <button class="btn use" id="useBtn">店員さんに見せて使う</button>
    <button class="btn sub" id="againBtn">もう一回あそぶ</button>
    <button class="link" id="titlesBtn2">称号コレクション</button>
  </div>
</div>

<div class="screen" id="lose">
  <div class="emptybox">
    <h3>宝箱は空っぽ…</h3>
    <div class="msg" id="loseMsg"></div>
    <div class="newt" id="newLose"></div>
  </div>
  <div class="bottom">
    <button class="btn" id="retryBtn">もう一回挑戦!!</button>
    <button class="link" id="keepBtn" hidden>今の特典を見る</button>
    <button class="link" id="titlesBtn3">称号コレクション</button>
  </div>
</div>

<div class="screen shade" id="titles">
  <div class="tl-head">称号コレクション <span id="tlCount"></span></div>
  <div class="tl-best" id="tlBest"></div>
  <button class="btn sub" id="tlClose">もどる</button>
  <ul class="tl" id="tlList"></ul>
</div>

<script>
/* ===== 設定（お店に確認してからここを書き換える） ===== */
const CONFIG = {
  throws: 3,               // 投げる回数
  dayStartsAt: 6,          // この時刻より前は前の日の営業あつかい（深夜営業のため）
  // 特典：点数が高いほど 特典1 が出やすい
  prizes: [
    { name: '特典1', note: '' },   // 候補：海賊ジョッキにアップグレード
    { name: '特典2', note: '' },   // 候補：ドリンク1杯無料
    { name: '特典3', note: '' },   // 候補：ショット（はずれ）
  ],
  happenChance: 0.4,       // 1投ごとにハプニングが起きる確率
  goldBonus: 50,           // 金のお化けに当てたときのボーナス点
  // 点数ごとの「空っぽの宝箱」の数（上から順に見て、最初に当てはまったもの）
  emptyChests: [
    { min: 160, empty: 0 },  // 160点以上：3つとも当たり
    { min: 80,  empty: 1 },  // 80〜159点：1つ空っぽ
    { min: 0,   empty: 2 },  // 79点以下：2つ空っぽ
  ],
};
function emptyCount(score){
  for (const t of CONFIG.emptyChests) if (score >= t.min) return t.empty;
  return 0;
}
// 点数(0〜300)ごとの出やすさ [特典1, 特典2, 特典3]
function prizeWeights(score){
  const r = Math.min(1, score / 300);
  return [0.10 + 0.50*r, 0.30, 0.60 - 0.50*r];
}

/* ===== 宝箱は1日1回（このスマホの中だけで覚える） ===== */
const KEY = 'tooosu-jug-prize';
function businessDay(){
  const d = new Date(Date.now() - CONFIG.dayStartsAt*3600*1000);
  // スマホの時計（日本時間）の日付を使う。toISOString は世界標準時なので使わない
  const mm = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
  return { key: `${d.getFullYear()}-${mm}-${dd}`, mmdd: `${mm}${dd}` };
}
function loadToday(){
  try { const v = JSON.parse(localStorage.getItem(KEY) || 'null'); if (v && v.day === businessDay().key) return v; } catch(e){}
  return null;
}
function saveToday(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} }

/* ===== 称号と自己ベスト（このスマホの中だけで覚える） ===== */
const TITLES = [
  { id:'first',   name:'初ぴったり',         how:'ぴったりを出す' },
  { id:'combo2',  name:'二連ぴったり',       how:'ぴったりを2連続で出す' },
  { id:'legend',  name:'伝説の航海士',       how:'3投ともぴったりで止める' },
  { id:'dodge',   name:'お化けよけ名人',     how:'1回の挑戦でお化けを2回ともよける' },
  { id:'boo',     name:'お化けと友だち',     how:'お化けにぶつかる' },
  { id:'crash',   name:'ジョッキ割り',       how:'カウンターの奥からジョッキを落とす' },
  { id:'cat',     name:'黒猫にどつかれた',   how:'黒猫にぶつかる' },
  { id:'gold',    name:'金のお化けハンター', how:'金のお化けに当てる' },
  { id:'wind',    name:'追い風の達人',       how:'追い風のときにぴったりで止める' },
  { id:'s300',    name:'300点の壁',          how:'1回の挑戦で300点以上とる' },
  { id:'regular', name:'Tooosuの常連',       how:'10回挑戦する' },
];
const SKEY = 'tooosu-jug-stats';
function loadStats(){
  try { const v = JSON.parse(localStorage.getItem(SKEY) || 'null');
    if (v && typeof v === 'object') return { best: v.best|0, plays: v.plays|0, titles: v.titles || {} }; } catch(e){}
  return { best:0, plays:0, titles:{} };
}
let stats = loadStats(), newTitles = [], newBest = false;
function saveStats(){ try { localStorage.setItem(SKEY, JSON.stringify(stats)); } catch(e){} }
function unlock(id){
  if (stats.titles[id]) return;
  stats.titles[id] = Date.now(); saveStats();
  const t = TITLES.find(t => t.id === id); newTitles.push(t.name);
  pop(W/2, 96, `称号ゲット!! ${t.name}`, '#ffd23f', 24, 2.4);
}
function titleCount(){ return TITLES.filter(t => stats.titles[t.id]).length; }

/* ===== 画面の準備 ===== */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 420, H = 760, scale = 1, dpr = 1;
const L = 900, Z0 = 520, HALF = 150;           // カウンターの長さ・遠近・半分の幅
let nearY, farY, vanY, pFar;
function resize(){
  dpr = Math.min(window.devicePixelRatio||1, 2);
  cv.width = Math.round(innerWidth*dpr); cv.height = Math.round(innerHeight*dpr);
  scale = Math.min(innerWidth/420, innerHeight/720);
  W = innerWidth/scale; H = innerHeight/scale;
  nearY = H - 165; farY = H*0.37; pFar = P(L);
  vanY = (farY - nearY*pFar) / (1 - pFar);
}
function P(s){ return Z0 / (Z0 + s); }                       // 奥ほど小さく
function SY(s){ return vanY + (nearY - vanY) * P(s); }       // 奥行き → 画面の高さ
function SX(x, s){ return W/2 + x * P(s); }                  // 横の位置 → 画面の横
addEventListener('resize', resize); resize();

const $ = id => document.getElementById(id);
function show(id){ ['title','result','lose','titles'].forEach(s => $(s).classList.toggle('on', s===id)); }
// 結果・空っぽ・称号のどれかが出ていれば「終わりの画面を表示中」（称号を開いても結果画面に戻されないように）
const endShown = () => ['result','lose','titles'].some(id => $(id).classList.contains('on'));
const rand = (a,b) => a + Math.random()*(b-a);
const FONT = s => `${s}px "Dela Gothic One","Hiragino Sans",sans-serif`;
const easeOut = x => 1 - Math.pow(1-x, 3);

/* ===== 状態 ===== */
let state = 'title', T = 0, last = performance.now(), hitstop = 0, shake = 0;
let throwNo = 0, total = 0, phase = 'aim', phaseT = 0, results = [];
const jug = { s:0, v:0, drop:0, slosh:0, bonus:0 };
let target = 700, wet = null, ghost = null, owner = null;
let combo = 0, hap = null, cat = null, dodged = 0;   // コンボ・ハプニング・お化けをよけた回数
let parts = [], texts = [], trail = [];

function newThrow(){
  throwNo++; phase = 'aim'; phaseT = 0;
  jug.s = 0; jug.v = 0; jug.drop = 0;
  target = rand(560, L - 60);
  wet = throwNo >= 2 ? (()=>{ const s = rand(160, target - 200); return { s, len: rand(80, 130) }; })() : null;
  ghost = throwNo >= 2 ? { s: rand(260, target - 100), ph: Math.random()*6, sp: throwNo === 3 ? 2.6 : 1.8, hit:false, gold:false } : null;
  jug.bonus = 0;
  // ハプニング：追い風・黒猫・金のお化け（お化けがいる投げのときだけ）
  hap = null; cat = null;
  if (Math.random() < CONFIG.happenChance){
    const opts = ['wind', 'cat']; if (ghost) opts.push('gold');
    hap = opts[Math.floor(Math.random()*opts.length)];
    if (hap === 'gold') ghost.gold = true;
    if (hap === 'cat') cat = { s: rand(220, target - 80), x: rand(-HALF, HALF), dir: Math.random() < .5 ? -1 : 1, sp: rand(80, 120), hit:false, fly:0 };
    pop(W/2, nearY - 260, 'ハプニング!!', '#ff8a1c', 44, 1.6);
  }
}
function start(){
  throwNo = 0; total = 0; results = []; parts = []; texts = []; owner = null;
  combo = 0; dodged = 0; newTitles = []; newBest = false;
  state = 'play'; show(null); newThrow();
}
$('startBtn').addEventListener('pointerdown', e => { e.stopPropagation(); start(); });
$('againBtn').addEventListener('pointerdown', e => { e.stopPropagation(); start(); });
$('retryBtn').addEventListener('pointerdown', e => { e.stopPropagation(); start(); });
function refreshBest(){
  $('bestLine').textContent = stats.plays ? `自己ベスト ${stats.best}点　称号 ${titleCount()}/${TITLES.length}` : '';
}
let titlesFrom = 'title';
function openTitles(e){
  e.stopPropagation();
  titlesFrom = ['title','result','lose'].find(id => $(id).classList.contains('on')) || 'title';
  $('tlCount').textContent = `${titleCount()}/${TITLES.length}`;
  $('tlBest').textContent = `自己ベスト ${stats.best}点・挑戦 ${stats.plays}回`;
  $('tlList').innerHTML = '';
  for (const t of TITLES){
    const on = !!stats.titles[t.id], li = document.createElement('li');
    if (on) li.className = 'on';
    li.innerHTML = `<span class="ic">${on ? '★' : '？'}</span><span><b></b><small></small></span>`;
    li.querySelector('b').textContent = on ? t.name : '？？？';
    li.querySelector('small').textContent = t.how;
    $('tlList').appendChild(li);
  }
  show('titles');
}
['titlesBtn','titlesBtn2','titlesBtn3'].forEach(id => $(id).addEventListener('pointerdown', openTitles));
$('tlClose').addEventListener('pointerdown', e => { e.stopPropagation(); refreshBest(); show(titlesFrom); });
refreshBest();

/* ===== 操作：上にシュッとはじく ===== */
let samples = [], dragging = false;
const LX = e => e.clientX/scale, LY = e => e.clientY/scale;
addEventListener('pointerdown', e => {
  if (state === 'owner'){ pickChest(LX(e), LY(e)); return; }
  if (state !== 'play' || phase !== 'aim') return;
  dragging = true; samples = [{x:LX(e), y:LY(e), t:performance.now()}]; trail = [];
});
addEventListener('pointermove', e => {
  if (!dragging) return;
  const s = {x:LX(e), y:LY(e), t:performance.now()};
  samples.push(s); trail.push({x:s.x, y:s.y, life:.35});
  while (samples.length > 2 && s.t - samples[0].t > 120) samples.shift();
});
addEventListener('pointerup', release);
addEventListener('pointercancel', () => dragging = false);
function release(){
  if (!dragging) return; dragging = false;
  if (samples.length < 2) return;
  const a = samples[0], b = samples[samples.length-1];
  const dt = Math.max(16, b.t - a.t) / 1000;
  const vy = (a.y - b.y) / dt;            // 上向きの速さ
  if (vy < 150){ pop(W/2, nearY - 120, '上に シュッ!!', '#fff6e6', 34); return; }
  jug.v = Math.min(1300, vy * 0.42);
  phase = 'slide'; phaseT = 0;
}

/* ===== 演出 ===== */
function burst(x,y,col,n=14,sp=260){
  for (let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=rand(sp*.3,sp);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-120,life:rand(.4,.9),max:.9,col,r:rand(3,8)}); }
}
function pop(x,y,str,col,size=40,life=1.2){ texts.push({x,y,str,col,size,life}); }

/* ===== 判定 ===== */
function judge(){
  const d = Math.abs(jug.s - target), x = W/2, y = SY(jug.s) - 40*P(jug.s);
  let pts, word, col;
  if (d <= 10){
    combo++; pts = 100 * combo; word = 'ぴったり!!'; col = '#ffd23f'; hitstop = .18; shake = 10 + combo*3; burst(x, y, '#ffd23f', 40*combo, 380);
    if (combo >= 2) pop(W/2, nearY - 205, `${combo}連続!! ×${combo}`, '#ff8a1c', 46, 1.6);
    unlock('first'); if (combo >= 2) unlock('combo2'); if (hap === 'wind') unlock('wind');
    finishThrow(pts, word, col); return;
  }
  combo = 0;
  if (d <= 30){ pts = 60; word = 'おしい!!'; col = '#ff8a1c'; burst(x, y, '#ff8a1c', 18, 240); }
  else if (d <= 70){ pts = 30; word = 'まあまあ'; col = '#fff6e6'; }
  else { pts = 10; word = jug.s < target ? 'とどかず…' : 'いきすぎ…'; col = '#b8c8ff'; }
  finishThrow(pts, word, col);
}
function finishThrow(pts, word, col){
  pts += jug.bonus;
  total += pts; results.push(pts);
  pop(W/2, nearY - 150, word, col, 62, 1.4);
  pop(W/2, nearY - 95, `+${pts}`, col, 40, 1.4);
  phase = 'judge'; phaseT = 0;
}
function ghostX(){ return Math.sin(ghost.ph) * 210; }

/* ===== 更新 ===== */
function update(dt){
  T += dt; phaseT += dt;
  if (state === 'play'){
    if (ghost) ghost.ph += dt*ghost.sp;
    if (cat){
      if (cat.hit) cat.fly += dt;
      else {
        cat.x += cat.dir * cat.sp * dt;
        if (cat.x > HALF + 20){ cat.x = HALF + 20; cat.dir = -1; }
        if (cat.x < -HALF - 20){ cat.x = -HALF - 20; cat.dir = 1; }
      }
    }
    if (phase === 'slide'){
      const onWet = wet && jug.s > wet.s && jug.s < wet.s + wet.len;
      const prev = jug.s;
      jug.v = Math.max(0, jug.v - (onWet ? 70 : (hap === 'wind' ? 230 : 330))*dt);
      jug.s += jug.v*dt;
      jug.slosh = Math.min(1, jug.v/900);
      // お化け：カウンターの真ん中にいるときに通ると止められる
      if (ghost && !ghost.hit && prev < ghost.s && jug.s >= ghost.s){
        const gx = SX(ghostX(), ghost.s), gy = SY(ghost.s) - 70*P(ghost.s);
        if (Math.abs(ghostX()) < 60){
          ghost.hit = true;
          if (ghost.gold){
            // 金のお化け：止められず、ボーナス点
            jug.bonus += CONFIG.goldBonus; hitstop = .12; shake = 8;
            burst(gx, gy, '#ffd23f', 34, 320);
            pop(gx, gy - 40, `金のお化け!! +${CONFIG.goldBonus}`, '#ffd23f', 34);
            unlock('gold');
          } else {
            jug.v = Math.min(jug.v * 0.15, 110); hitstop = .16; shake = 12;  // 急ブレーキ：ほぼその場で止まる
            burst(gx, gy, '#e8e4ff', 16, 260);
            pop(gx, gy - 40, 'ヒィッ!! 急ブレーキ!!', '#e6392b', 40);
            unlock('boo');
          }
        } else if (!ghost.gold){
          ghost.passed = true; dodged++;
          if (dodged >= 2) unlock('dodge');
        }
      }
      // 黒猫：当たるとどつかれて、ジョッキが加速する
      if (cat && !cat.hit && prev < cat.s && jug.s >= cat.s && Math.abs(cat.x) < 45){
        cat.hit = true; jug.v = jug.v * 1.35 + 120; hitstop = .1; shake = 8;
        const cx = SX(cat.x, cat.s), cy = SY(cat.s) - 20*P(cat.s);
        burst(cx, cy, '#2a2030', 16, 240);
        pop(cx, cy - 40, 'ニャッ!! どつかれた!!', '#ffd23f', 36);
        unlock('cat');
      }
      if (jug.s > L + 8){ phase = 'fall'; }
      else if (jug.v <= 0) judge();
    } else if (phase === 'fall'){
      jug.s += jug.v*0.4*dt; jug.drop += 260*dt + jug.drop*3*dt;
      if (jug.drop > 70){
        const x = W/2, y = SY(L);
        burst(x, y, '#c9a46a', 30, 320); burst(x, y, '#fff6e6', 20, 260);
        shake = 16; hitstop = .12;
        combo = 0; unlock('crash');
        finishThrow(0, 'ガシャーン!!', '#e6392b');
        jug.drop = 9999;
      }
    } else if (phase === 'judge' && phaseT > 1.6){
      if (throwNo < CONFIG.throws) newThrow(); else startOwner();
    }
  } else if (state === 'owner'){
    updateOwner(dt);
  } else {
    if (ghost) ghost.ph += dt;
  }
  for (const q of parts){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=700*dt; q.life-=dt; }
  parts = parts.filter(q => q.life>0);
  for (const s of texts){ s.y -= 36*dt; s.life -= dt; }
  texts = texts.filter(s => s.life>0);
  for (const p of trail) p.life -= dt;
  trail = trail.filter(p => p.life>0);
}

/* ===== 店主と宝箱 ===== */
function rankOf(s){
  if (s >= 450) return 'Tooosuの伝説';
  if (s >= 250) return 'カウンターの職人';
  if (s >= 120) return '見習いバーテン';
  return '新入り水夫';
}
function startOwner(){
  state = 'owner';
  const saved = loadToday();
  const legend = combo >= CONFIG.throws;   // 全部ぴったり
  // 今日の特典：使用済みなら引けない／その点数を超えていなければ引き直せない
  const repeat = saved ? (saved.used ? 'used' : (total > saved.score ? null : 'hold')) : null;
  owner = { t:0, picked:false, pickT:0, lost:false, legend, empty: legend ? 0 : emptyCount(total), repeat, prev: saved,
    chests: [-118, 0, 118].map((x,i) => ({ x, s: L + 40, ts: 110, open:0, prize:null, chosen:false, delay: 0.9 + i*0.25 })) };
  // 自己ベスト・称号
  stats.plays++;
  if (total > stats.best){ newBest = stats.best > 0; stats.best = total; }
  saveStats();
  if (legend) unlock('legend');
  if (total >= 300) unlock('s300');
  if (stats.plays >= 10) unlock('regular');
  const note = (newBest ? `自己ベスト更新!! ${total}点` : `自己ベスト ${stats.best}点`) + (newTitles.length ? `<br>称号ゲット：${newTitles.join('・')}` : '');
  $('newWin').innerHTML = note; $('newLose').innerHTML = note;
  refreshBest();
  if (repeat) fillCoupon(saved, repeat);
}
function updateOwner(dt){
  const o = owner; o.t += dt;
  if (o.repeat){
    if (o.t > 1.4 && !endShown()) show('result');
    return;
  }
  o.chests.forEach(c => {
    if (o.t > c.delay) c.s += (c.ts - c.s) * Math.min(1, dt*3.5);
    if (o.picked && o.pickT > (c.chosen ? 0 : 0.9)) c.open = Math.min(1, c.open + dt*3);
  });
  if (o.picked){
    o.pickT += dt;
    if (o.pickT > 1.8 && !endShown()) show(o.lost ? 'lose' : 'result');
  }
}
function chestScreen(c){ const p = P(c.s); return { x: SX(c.x, c.s), y: SY(c.s), k: p*1.05 }; }
function pickChest(x, y){
  const o = owner; if (!o || o.repeat || o.picked || o.t < 2.2) return;
  const c = o.chests.find(c => { const q = chestScreen(c); return Math.abs(x - q.x) < 50*q.k + 8 && y > q.y - 100*q.k && y < q.y + 20; });
  if (!c) return;
  // 空っぽの宝箱が e 個まざっている。選んだ箱が空っぽになる確率は e/3
  const e = o.empty;
  let k = -1;
  if (o.legend){ k = 0; }
  else if (Math.random() >= e / 3){
    const w = prizeWeights(total), sum = w.reduce((a,b)=>a+b,0);
    let r = Math.random()*sum; k = 0; while (k < 2 && r > w[k]) { r -= w[k]; k++; }
  }
  const emptiesLeft = e - (k === -1 ? 1 : 0);
  const otherPrizes = [0,1,2].filter(i => i !== k).sort(() => Math.random()-.5);
  const rest = [...Array(emptiesLeft).fill(-1), ...otherPrizes].slice(0, 2).sort(() => Math.random()-.5);
  c.chosen = true; c.prize = k;
  o.chests.filter(d => d !== c).forEach((d,i) => d.prize = o.legend ? 0 : rest[i]);
  o.picked = true; o.pickT = 0;
  const q = chestScreen(c);
  if (k === -1){
    // 空っぽ：記録しないので、何度でも挑戦できる
    o.lost = true; hitstop = .08; shake = 6;
    burst(q.x, q.y - 40, '#8a7a6a', 26, 220);
    const next = CONFIG.emptyChests.filter(t => t.min > total).sort((a,b) => a.min - b.min)[0];
    $('loseMsg').textContent = `${total}点・${rankOf(total)}` + (next ? `　あと${next.min - total}点で空っぽが${e - next.empty}個へるぜ!!` : '')
      + (o.prev ? `\n前の特典（${CONFIG.prizes[o.prev.prize].name}）はそのまま使えるぜ` : '');
    $('keepBtn').hidden = !o.prev;
    if (o.prev) fillCoupon(o.prev, 'hold');
    return;
  }
  hitstop = .12; shake = 10;
  burst(q.x, q.y - 40, '#ffd23f', 50, 420);
  const day = businessDay();
  const rec = { day: day.key, prize: k, score: total, code: `${day.mmdd}-${Math.floor(1000+Math.random()*9000)}`, used:false };
  saveToday(rec);
  fillCoupon(rec, o.prev ? 'redraw' : 'new');
}
// mode: new=初めて当たり／redraw=引き直しで入れかわり／hold=今日の特典を表示／used=使用済み
function fillCoupon(rec, mode){
  const p = CONFIG.prizes[rec.prize];
  $('cpBody').textContent = p.name;
  $('cpMeta').textContent = `${rec.score}点・${rankOf(rec.score)}　No. ${rec.code}　本日かぎり・お一人様1日1回` + (p.note ? `／${p.note}` : '');
  const again = {
    redraw: '引き直し成功!! 特典が入れかわったぜ',
    hold: `※今日の特典です。${rec.score}点をこえたら引き直せます`,
    used: '※今日の特典は使用済み。また明日!!',
  }[mode];
  $('cpAgain').textContent = again || ''; $('cpAgain').hidden = !again;
  const used = !!rec.used;
  $('cpStamp').hidden = !used;
  if (used){
    const t = new Date(rec.usedAt || Date.now());
    $('cpStamp').innerHTML = `使用済み<small>${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}</small>`;
  }
  $('useBtn').hidden = used;
  $('useConfirm').hidden = true;
  $('cpShow').textContent = used ? 'また明日、挑戦しに来てね' : 'ハイスコアで引き直しOK。使うときは店員さんに見せてね';
}

  ctx.fillStyle = '#9a6030';
  ctx.beginPath(); ctx.moveTo(-26,0); ctx.lineTo(26,0); ctx.lineTo(24,-64); ctx.lineTo(-24,-64); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(60,30,10,.6)'; ctx.lineWidth = 2;
  for (let i=-16;i<=16;i+=10){ ctx.beginPath(); ctx.moveTo(i,-2); ctx.lineTo(i*0.95,-62); ctx.stroke(); }
  ctx.fillStyle = '#3a3a40'; ctx.fillRect(-26,-16,52,7); ctx.fillRect(-25,-54,50,7);
  ctx.fillStyle = '#c9a03a'; ctx.beginPath(); ctx.arc(0,-35,8,0,7); ctx.fill();
  ctx.fillStyle = '#fff6e6';
  for (let i=0;i<5;i++){ ctx.beginPath(); ctx.arc(-20 + i*10, -66 - Math.sin(T*10+i)*2*slosh - (i%2)*3, 9, 0, 7); ctx.fill(); }
  ctx.restore();
}
function drawGhost(){
  if (!ghost) return;
  const p = P(ghost.s), x = SX(ghostX(), ghost.s), y = SY(ghost.s) - 70*p + Math.sin(T*3)*6*p;
  ctx.save(); ctx.translate(x, y); ctx.scale(p*1.3, p*1.3); ctx.globalAlpha = ghost.hit ? .35 : .92;
  ctx.fillStyle = ghost.gold ? 'rgba(255,210,63,.3)' : 'rgba(220,214,255,.18)'; ctx.beginPath(); ctx.arc(0,-6,44,0,7); ctx.fill();
  ctx.fillStyle = ghost.gold ? '#ffd23f' : '#f0ecff';
  ctx.beginPath(); ctx.arc(0,-10,26,Math.PI,0); ctx.lineTo(26,20);
  for (let i=0;i<4;i++){ const xx = 26 - (i+1)*13; ctx.quadraticCurveTo(xx+6.5, 20 + (i%2?-8:8) + Math.sin(T*8+i)*3, xx, 20); }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2a1240';
  ctx.beginPath(); ctx.ellipse(-9,-12,4,6,0,0,7); ctx.ellipse(9,-12,4,6,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0,4,6,7,0,0,7); ctx.fill();
  ctx.restore();
  // 影（通り道がわかるように）
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x, SY(ghost.s), 22*p, 5*p, 0, 0, 7); ctx.fill();
}
function drawOwner(){
  const o = owner, rise = easeOut(Math.min(1, o.t/0.6));
  const ox = W/2, base = SY(L) + 10 + (1-rise)*140, k = 0.75;
  ctx.save(); ctx.translate(ox, base); ctx.scale(k, k); ctx.rotate(Math.sin(T*2)*0.03);
  // 海賊のコート
  ctx.fillStyle = '#3a1a22'; ctx.beginPath(); ctx.roundRect(-62,-122,124,132,26); ctx.fill();
  ctx.fillStyle = '#f2e6d0'; ctx.beginPath(); ctx.moveTo(-20,-122); ctx.lineTo(20,-122); ctx.lineTo(0,-86); ctx.fill();
  ctx.fillStyle = '#e6392b'; ctx.fillRect(-62,-62,124,14);
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(-9,-64,18,18);
  ctx.fillStyle = '#c9a03a'; for (const [bx,by] of [[-34,-100],[-34,-82],[34,-100],[34,-82]]){ ctx.beginPath(); ctx.arc(bx,by,4,0,7); ctx.fill(); }
  ctx.translate(0,-150);
  ctx.fillStyle = 'rgba(255,170,70,.18)'; ctx.beginPath(); ctx.arc(0,-6,74,0,7); ctx.fill();
  // 顔
  ctx.fillStyle = '#e9b48a';
  ctx.beginPath(); ctx.ellipse(-31,4,7,10,0,0,7); ctx.ellipse(31,4,7,10,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0,2,31,35,0,0,7); ctx.fill();
  // あごひげ
  ctx.fillStyle = '#3a1e10';
  ctx.beginPath(); ctx.moveTo(-31,4); ctx.quadraticCurveTo(-35,48,0,56); ctx.quadraticCurveTo(35,48,31,4);
  ctx.quadraticCurveTo(18,26,0,24); ctx.quadraticCurveTo(-18,26,-31,4); ctx.fill();
  // 口（金歯つき）
  ctx.fillStyle = '#5a1a10'; ctx.beginPath(); ctx.arc(0,20,9,0,Math.PI); ctx.fill();
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(1,20,5,4);
  // 口ひげ
  ctx.fillStyle = '#3a1e10';
  ctx.beginPath(); ctx.ellipse(-11,14,13,5,0.3,0,7); ctx.ellipse(11,14,13,5,-0.3,0,7); ctx.fill();
  // 鼻
  ctx.fillStyle = '#d99a70'; ctx.beginPath(); ctx.ellipse(0,5,6,7,0,0,7); ctx.fill();
  // 右目と眉
  ctx.fillStyle = '#fff6e6'; ctx.beginPath(); ctx.ellipse(12,-6,5.5,5,0,0,7); ctx.fill();
  ctx.fillStyle = '#1a0d08'; ctx.beginPath(); ctx.arc(13,-5.5,2.8,0,7); ctx.fill();
  ctx.strokeStyle = '#3a1e10'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(5,-15); ctx.lineTo(20,-13); ctx.stroke();
  // 眼帯
  ctx.strokeStyle = '#1a0d08'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-31,-20); ctx.lineTo(30,-1); ctx.stroke();
  ctx.fillStyle = '#1a0d08'; ctx.beginPath(); ctx.ellipse(-12,-6,9,8,0,0,7); ctx.fill();
  // 海賊帽（三角帽＋どくろ）
  ctx.fillStyle = '#14100e';
  ctx.beginPath(); ctx.moveTo(-56,-16); ctx.quadraticCurveTo(0,-36,56,-16); ctx.lineTo(42,-42);
  ctx.quadraticCurveTo(0,-80,-42,-42); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#c9a03a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-56,-16); ctx.quadraticCurveTo(0,-36,56,-16); ctx.stroke();
  ctx.strokeStyle = '#fff6e6'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-10,-38); ctx.lineTo(10,-26); ctx.moveTo(10,-38); ctx.lineTo(-10,-26); ctx.stroke(); ctx.lineCap = 'butt';
  ctx.fillStyle = '#fff6e6'; ctx.beginPath(); ctx.arc(0,-46,8,0,7); ctx.fill(); ctx.fillRect(-4,-41,8,5);
  ctx.fillStyle = '#14100e'; ctx.beginPath(); ctx.arc(-3,-47,2,0,7); ctx.arc(3,-47,2,0,7); ctx.fill();
  ctx.restore();
  // ふきだし（結果が出るまで）
  if (o.t > 0.6 && !endShown()){
    const msg = o.repeat === 'used' ? '今日の特典は使ったで!! また明日な!!'
      : o.repeat === 'hold' ? `今日は${o.prev.score}点で開けたで!! こえたら引き直しや!!`
      : o.picked ? (o.lost ? '空っぽやったか!! もう一回挑戦や!!' : (o.prev ? '引き直し成功や!! 店員に見せてや!!' : 'まいど!! 店員に見せてや!!'))
      : (o.prev && !o.legend) ? (o.empty === 0 ? 'ハイスコアや!! 引き直し、全部当たりや!!' : `ハイスコアや!! 引き直しや!! 空っぽ${o.empty}個入りや`)
      : o.legend ? '伝説や!! 金の宝箱、どれでも特典1や!!'
      : (o.empty === 0 ? 'ようやった!! 全部当たりや!! 1個選び!!' : `空っぽが${o.empty}個まざっとるで!! 1個選び!!`);
    const size = Math.min(20, (W-60)/msg.length*1.05);
    ctx.font = FONT(size); const tw = ctx.measureText(msg).width;
    const bx = W/2 - tw/2 - 16, by = 18, bh = size + 26;
    ctx.fillStyle = '#fff6e6'; ctx.beginPath(); ctx.roundRect(bx, by, tw + 32, bh, 12); ctx.fill();
    ctx.beginPath(); ctx.moveTo(W/2 - 10, by + bh); ctx.lineTo(W/2 + 4, by + bh + 16); ctx.lineTo(W/2 + 12, by + bh); ctx.fill();
    ctx.fillStyle = '#2a1000'; ctx.textAlign = 'center'; ctx.fillText(msg, W/2, by + bh/2 + size*0.36);
  }
}
function drawChest(c, idx){
  const q = chestScreen(c), o = owner;
  ctx.save(); ctx.translate(q.x, q.y + ((!o.picked && o.t > 2.2) ? Math.sin(T*5+idx)*3 : 0)); ctx.scale(q.k, q.k);
  const lg = o.legend;
  if (lg && c.open === 0){ ctx.fillStyle = `rgba(255,220,90,${.22 + .1*Math.sin(T*6+idx)})`; ctx.beginPath(); ctx.arc(0,-40,70,0,7); ctx.fill(); }
  if (c.open > 0 && c.chosen && c.prize !== -1){
    ctx.fillStyle = `rgba(255,220,90,${.35*c.open})`;
    for (let i=0;i<7;i++){ ctx.save(); ctx.rotate(-Math.PI/2 + (i-3)*0.28); ctx.fillRect(40, -6, 220*c.open, 12); ctx.restore(); }
  }
  ctx.globalAlpha = (o.picked && !c.chosen) ? .6 : 1;
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0,0,50,9,0,0,7); ctx.fill();
  ctx.fillStyle = lg ? '#c9962a' : '#7a4318'; ctx.beginPath(); ctx.roundRect(-44,-50,88,50,6); ctx.fill();
  ctx.fillStyle = lg ? '#fff1a8' : '#c9a03a'; ctx.fillRect(-44,-50,88,6); ctx.fillRect(-30,-50,8,50); ctx.fillRect(22,-50,8,50);
  ctx.save(); ctx.translate(0,-50); ctx.scale(1, 1 - c.open*1.6);
  ctx.fillStyle = lg ? '#e8c24a' : '#8a4f20'; ctx.beginPath(); ctx.moveTo(-46,0); ctx.lineTo(46,0); ctx.quadraticCurveTo(46,-34,0,-36); ctx.quadraticCurveTo(-46,-34,-46,0); ctx.fill();
  ctx.fillStyle = lg ? '#fff1a8' : '#c9a03a'; ctx.fillRect(-30,-30,8,30); ctx.fillRect(22,-30,8,30);
  ctx.restore();
  if (c.open < .2){ ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.roundRect(-8,-44,16,16,3); ctx.fill(); ctx.fillStyle = '#2a1000'; ctx.fillRect(-2,-39,4,7); }
  if (c.open > .5 && c.prize !== null){
    ctx.globalAlpha = (c.chosen ? 1 : .75) * Math.min(1, (c.open-.5)*2);
    ctx.font = FONT(c.chosen ? 26 : 20); ctx.textAlign = 'center';
    ctx.lineWidth = 6; ctx.strokeStyle = '#1a0d08';
    const isEmpty = c.prize === -1;
    const label = isEmpty ? '空っぽ' : CONFIG.prizes[c.prize].name;
    ctx.strokeText(label, 0, -74);
    ctx.fillStyle = isEmpty ? '#a89a8a' : (c.chosen ? '#ffd23f' : '#fff6e6'); ctx.fillText(label, 0, -74);
  }
  ctx.restore();
}

function drawHUD(){
  ctx.textAlign = 'left'; ctx.font = FONT(22); ctx.fillStyle = '#fff6e6';
  ctx.lineWidth = 5; ctx.strokeStyle = '#1a0d08';
  const lbl = `${Math.min(throwNo, CONFIG.throws)}/${CONFIG.throws}投目`;
  ctx.strokeText(lbl, 16, 34); ctx.fillText(lbl, 16, 34);
  results.forEach((p,i) => { ctx.font = FONT(15); ctx.fillStyle = p >= 100 ? '#ffd23f' : p ? '#fff6e6' : '#e6392b'; ctx.fillText(p ? `${p}` : '×', 18 + i*38, 56); });
  ctx.textAlign = 'right'; ctx.font = FONT(30); ctx.fillStyle = '#fff6e6';
  ctx.strokeText(`${total}点`, W-16, 38); ctx.fillText(`${total}点`, W-16, 38);
  if (combo > 0 && throwNo <= CONFIG.throws && phase !== 'judge'){
    ctx.font = FONT(18); ctx.fillStyle = '#ff8a1c';
    const cm = combo >= 2 ? `${combo}連続中!! 次ぴったりで×${combo+1}` : `次ぴったりで×${combo+1}!!`;
    ctx.strokeText(cm, W-16, 62); ctx.fillText(cm, W-16, 62);
  }
  if (phase === 'aim'){
    ctx.globalAlpha = .6 + .4*Math.sin(T*6);
    ctx.textAlign = 'center'; ctx.font = FONT(24); ctx.fillStyle = '#fff6e6';
    ctx.strokeText('👆 上にシュッとはじけ!!', W/2, H - 60); ctx.fillText('👆 上にシュッとはじけ!!', W/2, H - 60);
    ctx.globalAlpha = 1;
    const HAP = { wind:'追い風!! いつもよりよくすべるぞ', cat:'黒猫が横切る!! 当たるとどつかれて加速', gold:`金のお化け!! 当てると+${CONFIG.goldBonus}点・止まらない` };
    if (hap || throwNo >= 2){
      ctx.font = FONT(15); ctx.fillStyle = hap ? '#ffd23f' : '#ffb38a';
      const m = hap ? HAP[hap] : throwNo === 3 ? 'ラスト!! お化けも速いぞ' : 'お化けに当たると急ブレーキ!! よけて投げろ';
      ctx.strokeText(m, W/2, H - 30); ctx.fillText(m, W/2, H - 30);
    }
    ctx.strokeStyle = 'rgba(255,246,230,.55)'; ctx.lineWidth = 4; ctx.setLineDash([10,10]);
    ctx.beginPath(); ctx.moveTo(W/2, nearY - 90); ctx.lineTo(W/2, nearY - 190 - Math.sin(T*6)*10); ctx.stroke(); ctx.setLineDash([]);
  }
}

function draw(){
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake,shake), rand(-shake,shake));
  drawRoom();
  if (state === 'owner') drawOwner();
  drawCounter();
  if (state === 'play'){
    drawWet(); drawWind(); drawTarget();
    const ghostBehind = ghost && ghost.s > jug.s, catBehind = cat && cat.s > jug.s;
    if (catBehind) drawCat();
    if (ghostBehind) drawGhost();
    if (jug.drop < 9999){
      const p = P(jug.s);
      if (jug.drop > 0){ ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,SY(L)); ctx.clip(); }
      drawJug(W/2, SY(jug.s) + jug.drop*p, p, jug.slosh);
      if (jug.drop > 0) ctx.restore();
    }
    if (ghost && !ghostBehind) drawGhost();
    if (cat && !catBehind) drawCat();
  } else if (state === 'owner'){
    [...owner.chests].map((c,i)=>[c,i]).sort((a,b) => b[0].s - a[0].s).forEach(([c,i]) => drawChest(c,i));
    if (!owner.picked && !owner.repeat && owner.t > 2.2){
      ctx.fillStyle = '#ffd23f'; ctx.font = FONT(22); ctx.textAlign = 'center';
      ctx.lineWidth = 6; ctx.strokeStyle = '#1a0d08';
      const m = `${total}点・${rankOf(total)}`;
      ctx.strokeText(m, W/2, H - 50); ctx.fillText(m, W/2, H - 50);
    }
  } else {
    drawJug(W/2, SY(0), 1, 0);
  }
  for (const p of trail){ ctx.globalAlpha = p.life/.35; ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(p.x,p.y,8,0,7); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const q of parts){ ctx.globalAlpha = Math.max(0,q.life/q.max); ctx.fillStyle=q.col; ctx.fillRect(q.x-q.r/2,q.y-q.r/2,q.r,q.r); }
  ctx.globalAlpha = 1;
  for (const s of texts){
    ctx.globalAlpha = Math.min(1, s.life*2.5);
    ctx.font = FONT(s.size); ctx.textAlign = 'center';
    ctx.lineWidth = 7; ctx.strokeStyle = '#1a0d08'; ctx.strokeText(s.str, s.x, s.y);
    ctx.fillStyle = s.col; ctx.fillText(s.str, s.x, s.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (state === 'play') drawHUD();
}

function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  const wantDpr = Math.min(window.devicePixelRatio||1, 2);
  if (cv.width !== Math.round(innerWidth*wantDpr) || cv.height !== Math.round(innerHeight*wantDpr)) resize();
  if (shake > 0) shake = Math.max(0, shake - dt*40);
  if (hitstop > 0) hitstop -= dt; else update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
